# FROST Signer Stack — Standalone (for running signers independently)
#
# For the full devnet stack, use ../docker-compose.devnet.yml instead.
#
# Usage:
#   docker compose up --build -d

x-frost-common: &frost-common
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./config:/app/config
    - ./logs:/app/logs
  environment: &frost-env
    RUST_LOG: info,frost_server=debug
    FROST_KEY_PASSWORD: "${FROST_KEY_PASSWORD:-test}"
    FROST_API_KEY: "${FROST_API_KEY}"
  restart: unless-stopped

services:
  frost-signer-1:
    <<: *frost-common
    container_name: frost-signer-1
    ports:
      - "9001:9001"
    command: >
      run --bind 0.0.0.0:9001 --id 1
      --password test --network testnet4

  frost-signer-2:
    <<: *frost-common
    container_name: frost-signer-2
    ports:
      - "9002:9002"
    command: >
      run --bind 0.0.0.0:9002 --id 2
      --password test --network testnet4

  frost-signer-3:
    <<: *frost-common
    container_name: frost-signer-3
    ports:
      - "9003:9003"
    command: >
      run --bind 0.0.0.0:9003 --id 3
      --password test --network testnet4
