[package]
name = "zkbtc"
version = "0.1.0"
edition = "2021"

[features]
# v2 default: FROST kept available alongside Ika during the migration window.
# To build the slim Ika-only backend (Task 8 endgame), use:
#   cargo build --no-default-features --features ika-only
default = ["frost-legacy", "ika-only"]
# Legacy FROST 2-of-3 threshold signing (deposit sweeper + redemption MpcSigner).
frost-legacy = []
# Ika dWallet support (IkaSigner + Ika SigningMode variant).
ika-only = []

# Main binary - minimal launcher
[[bin]]
name = "zkbtc-api"
path = "src/main.rs"

# Redemption service binary
[[bin]]
name = "redemption"
path = "src/bin/redemption.rs"

[dependencies]
async-trait = "0.1"
sha2 = "0.10"
sha3 = "0.10"

bitcoin = { version = "0.32", features = ["rand-std"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }

solana-sdk = "2.0"
solana-client = "2.0"
solana-account-decoder = "2.0"
solana-system-interface = "1.0"
tokio = { version = "1.0", features = ["full"] }

rand = "0.8"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
bs58 = "0.5"
chrono = "0.4"
base64 = "0.22"

thiserror = "2"

reqwest = { version = "0.12", features = ["json"] }

axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

x25519-dalek = { version = "2.0", features = ["static_secrets"] }
k256 = { version = "0.13", features = ["ecdh"] }

dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# UUID for FROST sessions
uuid = { version = "1", features = ["v4"] }

# SQLite for persistent storage
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# Poseidon hashing for Merkle tree (circom-compatible BN254)
light-poseidon = "0.3"
ark-bn254 = "0.5"

[dev-dependencies]
mockall = "0.13"
tower = "0.5"
bitcoinconsensus = "0.106"
