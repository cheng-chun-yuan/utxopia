<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UTXOpia banner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

  html, body {
    margin: 0;
    padding: 0;
    width: 1200px;
    height: 630px;
    background: #000;
    color: #fff;
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }

  .frame {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 80px;
    box-sizing: border-box;
    gap: 56px;
    background: radial-gradient(ellipse at 50% 50%, rgba(208, 173, 92, 0.06), transparent 60%), #000;
  }

  .logo {
    width: 320px;
    height: 320px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }

  .text { display: flex; flex-direction: column; gap: 18px; }

  .title {
    font-size: 124px;
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
    /* gold gradient matching the logo accent */
    background: linear-gradient(180deg, #f4e5b8 0%, #c9a35b 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tagline {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.005em;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.72);
    max-width: 620px;
  }

  .ruler {
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, rgba(208, 173, 92, 0.9), transparent);
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="frame">
  <div class="logo"><img src="logo-transparent-2048.png" alt="UTXOpia" /></div>
  <div class="text">
    <div class="title">UTXOpia</div>
    <div class="tagline">Shielded DeFi for every token on Solana.</div>
    <div class="ruler"></div>
  </div>
</div>
</body>
</html>
