# zVault Devnet Stack — Backend + FROST Signers + Header Relayer
#
# Usage:
#   docker compose -f docker-compose.devnet.yml up --build -d
#   docker compose -f docker-compose.devnet.yml logs -f
#   docker compose -f docker-compose.devnet.yml down

x-frost-common: &frost-common
  build:
    context: ./frost_server
    dockerfile: Dockerfile
  volumes:
    - ./frost_server/config:/app/config
    - ./frost_server/logs:/app/logs
  environment: &frost-env
    RUST_LOG: info,frost_server=debug
    FROST_KEY_PASSWORD: test
  restart: unless-stopped

services:
  # ─── FROST Threshold Signers (2-of-3) ──────────────────────────────
  frost-signer-1:
    <<: *frost-common
    container_name: zvault-frost-1
    ports:
      - "9001:9001"
    command: >
      run --bind 0.0.0.0:9001 --id 1
      --password test --network testnet4

  frost-signer-2:
    <<: *frost-common
    container_name: zvault-frost-2
    ports:
      - "9002:9002"
    command: >
      run --bind 0.0.0.0:9002 --id 2
      --password test --network testnet4

  frost-signer-3:
    <<: *frost-common
    container_name: zvault-frost-3
    ports:
      - "9003:9003"
    command: >
      run --bind 0.0.0.0:9003 --id 3
      --password test --network testnet4

  # ─── Backend API ───────────────────────────────────────────────────
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zvault-backend
    ports:
      - "3001:3001"
    environment:
      RUST_LOG: info
      ZVAULT_NETWORK: devnet
      ZVAULT_SOLANA_RPC: https://api.devnet.solana.com
      ZVAULT_BITCOIN_RPC: https://mempool.space/testnet4/api
      ZVAULT_SIGNING_MODE: frost
      ZVAULT_FROST_THRESHOLD: "2"
      ZVAULT_FROST_PARTICIPANTS: "3"
      ZVAULT_FROST_SIGNER_URLS: http://frost-signer-1:9001,http://frost-signer-2:9002,http://frost-signer-3:9003
      ZVAULT_FROST_KEY_SHARE: placeholder
      ZVAULT_FROST_GROUP_PUBKEY: d857a067bec0ae2027a6026ef73d2905f108b1a66de6d12d23a3feb42013b1dd
      ZVAULT_DEMO_MODE: "1"
      API_PORT: "3001"
    depends_on:
      - frost-signer-1
      - frost-signer-2
      - frost-signer-3
    restart: unless-stopped

  # ─── Deposit Tracker + Event Indexer (auto-detect → sweep → SPV verify → tree cache) ─────────
  # Now includes real-time WebSocket detection + integrated header relay + Merkle tree cache
  deposit-tracker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zvault-deposit-tracker
    command: ["/app/zbtc-api", "tracker", "--interval", "60", "--confirmations", "1"]
    ports:
      - "3002:3001"
    volumes:
      - tracker-data:/app/data
    environment:
      RUST_LOG: info,zbtc=debug
      ZVAULT_NETWORK: devnet
      ZVAULT_SIGNING_MODE: frost
      ZVAULT_FROST_THRESHOLD: "2"
      ZVAULT_FROST_PARTICIPANTS: "3"
      ZVAULT_FROST_SIGNER_URLS: http://frost-signer-1:9001,http://frost-signer-2:9002,http://frost-signer-3:9003
      ZVAULT_FROST_KEY_SHARE: placeholder
      ZVAULT_FROST_GROUP_PUBKEY: d857a067bec0ae2027a6026ef73d2905f108b1a66de6d12d23a3feb42013b1dd
      ZVAULT_DEMO_MODE: "1"
      POOL_RECEIVE_ADDRESS: tb1pmpt6qea7czhzqfaxqfh0w0ffqhcs3vdxdhndztfr50ltggqnk8wsdrd5m5
      ESPLORA_URL: https://mempool.space/testnet4/api
      SOLANA_RPC_URL: https://api.devnet.solana.com
      DEPOSIT_DB_PATH: /app/data/deposits.db
      # Event indexer + Merkle tree cache
      INDEXER_DB_PATH: /app/data/events.db
      INDEXER_POLL_INTERVAL_SECS: "10"
      ZVAULT_PROGRAM_ID: 25eTdotdeY9EqfJy5tfXSAD5Dg8XTL29sQYVgz1tJkTM
      TRACKER_API_PORT: "3001"
      # Real-time WebSocket detection (mempool.space)
      MEMPOOL_WS_ENABLED: "true"
      MEMPOOL_WS_URL: wss://mempool.space/testnet4/api/v1/ws
      # Integrated header relay (replaces separate header-relayer service)
      HEADER_RELAY_ENABLED: "true"
      BTC_LIGHT_CLIENT_PROGRAM_ID: Ho6UTeF8yFnRdCK15tSZtcJozvkDABJZWYxkgGyWAfyq
      RELAYER_KEYPAIR: "${RELAYER_KEYPAIR}"
      HEADER_BATCH_SIZE: "5"
    depends_on:
      - frost-signer-1
      - frost-signer-2
      - frost-signer-3
    restart: unless-stopped

  # ─── Frontend (Next.js) ──────────────────────────────────────────
  zvault-app:
    build:
      context: .
      dockerfile: zvault-app/Dockerfile
    container_name: zvault-app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_NETWORK: devnet
      NEXT_PUBLIC_ZKBTC_API_URL: https://api.amidoggy.xyz
      NEXT_PUBLIC_SOLANA_RPC_URL: https://api.devnet.solana.com
      NEXT_PUBLIC_CIRCUIT_CDN_URL: https://circuits.amidoggy.xyz
      # Backend tree cache (fast Merkle proofs)
      TRACKER_API_URL: http://deposit-tracker:3001
      ADMIN_KEYPAIR: "${ADMIN_KEYPAIR}"
      RELAYER_KEYPAIR: "${RELAYER_KEYPAIR}"
    depends_on:
      - backend-api
      - deposit-tracker
    restart: unless-stopped

  # ─── Cloudflare Tunnel ───────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: zvault-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/zvault.yml run zvault
    volumes:
      - /Users/chengchunyuan/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - zvault-app
      - backend-api
    restart: unless-stopped

  # ─── Header Relayer (testnet4 → Solana devnet) ─────────────────────
  header-relayer:
    build:
      context: ./backend/header-relayer
      dockerfile: Dockerfile
    container_name: zvault-header-relayer
    environment:
      DEPLOY_ENV: devnet
      DEVNET_SOLANA_RPC_URL: https://api.devnet.solana.com
      DEVNET_PROGRAM_ID: Ho6UTeF8yFnRdCK15tSZtcJozvkDABJZWYxkgGyWAfyq
      DEVNET_RELAYER_KEYPAIR: "${DEVNET_RELAYER_KEYPAIR}"
      DEVNET_BITCOIN_NETWORK: testnet4
      DEVNET_START_BLOCK_HEIGHT: "124088"
      DEVNET_POLL_INTERVAL_MS: "30000"
    restart: unless-stopped

volumes:
  tracker-data:
