# UTXOpia Devnet Stack — Backend
#
# Frontend runs separately (Vercel, standalone Docker, or `bun run dev`)
# Custody is held by an Ika dWallet (see backend Ika env vars below).
#
# Usage:
#   docker compose -f docker-compose.devnet.yml up --build -d
#   docker compose -f docker-compose.devnet.yml logs -f
#   docker compose -f docker-compose.devnet.yml down

services:
  # ─── Unified Backend (API + Deposit Tracker + Event Indexer) ──────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: utxopia-backend
    command: ["/app/zkbtc-api", "tracker", "--interval", "60", "--confirmations", "1"]
    ports:
      - "3001:3001"
    volumes:
      - tracker-data:/app/data
      # Mount the host's johnny.json keypair (uFBM…) read-only.
      # The container references it via RELAYER_KEYPAIR/VERIFIER_KEYPAIR env vars.
      - ${HOME}/.config/solana/johnny.json:/app/keypair.json:ro
    environment:
      RUST_LOG: info,zkbtc=debug
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-https://aegis.amidoggy.xyz}"
      UTXOPIA_NETWORK: devnet
      UTXOPIA_BITCOIN_NETWORK: testnet4
      UTXOPIA_SOLANA_RPC: https://api.devnet.solana.com
      UTXOPIA_BITCOIN_RPC: https://mempool.space/testnet4/api
      # ─── Ika dWallet custody (replaces FROST) ─────────────────────
      UTXOPIA_SIGNING_MODE: ika
      UTXOPIA_IKA_PROGRAM_ID: 87W54kGYFQ1rgWqMeu4XTPHWXWmXSQCcjm8vCTfiq1oY
      UTXOPIA_IKA_GRPC_ENDPOINT: pre-alpha-dev-1.ika.ika-network.net:443
      UTXOPIA_IKA_DWALLET: DmZfRVeZHnFZ1ARVHRPJn88VCcJB2QhXLmSe8RuzFMfq
      UTXOPIA_IKA_DWALLET_XONLY_PUBKEY: 87a1014ea16e42c825026889874902875aec7650b39c2b334a4d04d49b904c76
      UTXOPIA_IKA_CPI_AUTHORITY_BUMP: "255"
      # ─── Programs (current live devnet IDs) ───────────────────────
      UTXOPIA_PROGRAM_ID: G1bj9Vw9ipZ2Z7zKa9HrcHHPNqeWjg7uu51TsDr3ixUy
      UTXOPIA_ZKBTC_MINT: CDqY9mTzbWma7GzCULTJMMZzyVothKEXtr7AnXdpD6v8
      BTC_LIGHT_CLIENT_PROGRAM_ID: C8JoSKzondM7X1ESwrBSodGMrXWtEWNmawXyjh9zEWJZ
      POOL_RECEIVE_ADDRESS: tb1p99y96qcldtg6krzv5uvrhmmvh88zmy2dp0kgmjzz56tz7r7vxd3qqn2q95
      # ─── Operational ─────────────────────────────────────────────
      UTXOPIA_DEMO_MODE: "1"
      ESPLORA_URL: https://mempool.space/testnet4/api
      SOLANA_RPC_URL: https://api.devnet.solana.com
      DEPOSIT_DB_PATH: /app/data/deposits.db
      INDEXER_DB_PATH: /app/data/events.db
      INDEXER_POLL_INTERVAL_SECS: "10"
      TRACKER_API_PORT: "3001"
      MEMPOOL_WS_ENABLED: "true"
      MEMPOOL_WS_URL: wss://mempool.space/testnet4/api/v1/ws
      HEADER_RELAY_ENABLED: "true"
      UTXOPIA_BROADCAST_MODE: real
      HEADER_BATCH_SIZE: "5"
      SERVICE_FEE_SATS: "500"
      RELAYER_FEE_SATS: "500"
      # Both vars point at the same mounted keypair.
      RELAYER_KEYPAIR: /app/keypair.json
      VERIFIER_KEYPAIR: /app/keypair.json
      # Optional: relayer's stealth meta-address for routing fee outputs.
      # Override at runtime if needed: RELAYER_STEALTH_META=... docker compose up
      RELAYER_STEALTH_META: "${RELAYER_STEALTH_META:-}"
    restart: unless-stopped

  # ─── Cloudflare Tunnel ───────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aegis-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/aegis-docker.yml run c4bdbf46-2acf-4b9d-9d72-c4d1f59fcde3
    volumes:
      - /Users/chengchunyuan/.cloudflared:/etc/cloudflared:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped

  # Header relay runs in-process inside `zkbtc-api tracker` when
  # HEADER_RELAY_ENABLED=true (set in the `backend` block above).
  # See backend/src/deposit_tracker/header_relayer.rs.

volumes:
  tracker-data:
