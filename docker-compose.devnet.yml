# Aegis Devnet Stack — Backend + FROST Signers
#
# Frontend runs separately (Vercel, standalone Docker, or `bun run dev`)
#
# Usage:
#   docker compose -f docker-compose.devnet.yml up --build -d
#   docker compose -f docker-compose.devnet.yml logs -f
#   docker compose -f docker-compose.devnet.yml down

x-frost-common: &frost-common
  build:
    context: ./frost_server
    dockerfile: Dockerfile
  volumes:
    - ./frost_server/config:/app/config
    - ./frost_server/logs:/app/logs
  environment: &frost-env
    RUST_LOG: info,frost_server=debug
    FROST_KEY_PASSWORD: "${FROST_KEY_PASSWORD:-test}"
    FROST_API_KEY: "${FROST_API_KEY}"
  restart: unless-stopped

services:
  # ─── FROST Threshold Signers (2-of-3) ──────────────────────────────
  frost-signer-1:
    <<: *frost-common
    container_name: aegis-frost-1
    expose:
      - "9001"
    command: >
      run --bind 0.0.0.0:9001 --id 1
      --password "${FROST_KEY_PASSWORD:-test}" --network testnet4

  frost-signer-2:
    <<: *frost-common
    container_name: aegis-frost-2
    expose:
      - "9002"
    command: >
      run --bind 0.0.0.0:9002 --id 2
      --password "${FROST_KEY_PASSWORD:-test}" --network testnet4

  frost-signer-3:
    <<: *frost-common
    container_name: aegis-frost-3
    expose:
      - "9003"
    command: >
      run --bind 0.0.0.0:9003 --id 3
      --password "${FROST_KEY_PASSWORD:-test}" --network testnet4

  # ─── Unified Backend (API + Deposit Tracker + Event Indexer) ──────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    command: ["/app/zkbtc-api", "tracker", "--interval", "60", "--confirmations", "1"]
    ports:
      - "3001:3001"
    volumes:
      - tracker-data:/app/data
    environment:
      RUST_LOG: info,zkbtc=debug
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-https://aegis.amidoggy.xyz}"
      AEGIS_NETWORK: devnet
      AEGIS_SOLANA_RPC: https://api.devnet.solana.com
      AEGIS_BITCOIN_RPC: https://mempool.space/testnet4/api
      AEGIS_SIGNING_MODE: frost
      AEGIS_FROST_THRESHOLD: "2"
      AEGIS_FROST_PARTICIPANTS: "3"
      AEGIS_FROST_API_KEY: "${FROST_API_KEY}"
      AEGIS_FROST_SIGNER_URLS: http://frost-signer-1:9001,http://frost-signer-2:9002,http://frost-signer-3:9003
      AEGIS_FROST_KEY_SHARE: placeholder
      AEGIS_FROST_GROUP_PUBKEY: d857a067bec0ae2027a6026ef73d2905f108b1a66de6d12d23a3feb42013b1dd
      AEGIS_DEMO_MODE: "1"
      POOL_RECEIVE_ADDRESS: tb1pmpt6qea7czhzqfaxqfh0w0ffqhcs3vdxdhndztfr50ltggqnk8wsdrd5m5
      ESPLORA_URL: https://mempool.space/testnet4/api
      SOLANA_RPC_URL: https://api.devnet.solana.com
      DEPOSIT_DB_PATH: /app/data/deposits.db
      INDEXER_DB_PATH: /app/data/events.db
      INDEXER_POLL_INTERVAL_SECS: "10"
      AEGIS_PROGRAM_ID: 8fqRet9WB5PECvKfWmzTPSusJgQz1onzxTLfHD75XKim
      TRACKER_API_PORT: "3001"
      MEMPOOL_WS_ENABLED: "true"
      MEMPOOL_WS_URL: wss://mempool.space/testnet4/api/v1/ws
      HEADER_RELAY_ENABLED: "true"
      BTC_LIGHT_CLIENT_PROGRAM_ID: Ho6UTeF8yFnRdCK15tSZtcJozvkDABJZWYxkgGyWAfyq
      RELAYER_KEYPAIR: "${RELAYER_KEYPAIR}"
      SERVICE_FEE_SATS: "500"
      RELAYER_FEE_SATS: "500"
      RELAYER_STEALTH_META: "${RELAYER_STEALTH_META:-}"
      AEGIS_BROADCAST_MODE: real
      VERIFIER_KEYPAIR: "${RELAYER_KEYPAIR}"
      HEADER_BATCH_SIZE: "5"
    depends_on:
      - frost-signer-1
      - frost-signer-2
      - frost-signer-3
    restart: unless-stopped

  # ─── Cloudflare Tunnel ───────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aegis-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/aegis.yml run 2cf1a4fa-ace1-4c53-9865-b3d8086dc516
    volumes:
      - /Users/chengchunyuan/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Header Relayer (testnet4 → Solana devnet) ─────────────────────
  header-relayer:
    build:
      context: ./backend/header-relayer
      dockerfile: Dockerfile
    container_name: aegis-header-relayer
    environment:
      DEPLOY_ENV: devnet
      DEVNET_SOLANA_RPC_URL: https://api.devnet.solana.com
      DEVNET_PROGRAM_ID: Ho6UTeF8yFnRdCK15tSZtcJozvkDABJZWYxkgGyWAfyq
      DEVNET_RELAYER_KEYPAIR: "${DEVNET_RELAYER_KEYPAIR}"
      DEVNET_BITCOIN_NETWORK: testnet4
      DEVNET_START_BLOCK_HEIGHT: "124088"
      DEVNET_POLL_INTERVAL_MS: "30000"
    restart: unless-stopped

volumes:
  tracker-data:
