# Privacy Coin Devnet Stack — Backend
#
# Frontend runs separately (Vercel, standalone Docker, or `bun run dev`)
# Custody is held by an Ika dWallet (see backend Ika env vars below).
#
# Usage:
#   docker compose -f docker-compose.devnet.yml up --build -d
#   docker compose -f docker-compose.devnet.yml logs -f
#   docker compose -f docker-compose.devnet.yml down

services:
  # ─── Unified Backend (API + Deposit Tracker + Event Indexer) ──────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: privacy-coin-backend
    command: ["/app/zkbtc-api", "tracker", "--interval", "60", "--confirmations", "1"]
    ports:
      - "3001:3001"
    volumes:
      - tracker-data:/app/data
    environment:
      RUST_LOG: info,zkbtc=debug
      ALLOWED_ORIGIN: "${ALLOWED_ORIGIN:-https://aegis.amidoggy.xyz}"
      PRIVACY_COIN_NETWORK: devnet
      # Single place to switch Bitcoin network: "testnet" (testnet3) or "testnet4"
      PRIVACY_COIN_BITCOIN_NETWORK: testnet4
      PRIVACY_COIN_SOLANA_RPC: https://devnet.helius-rpc.com/?api-key=200fd940-548a-473b-849b-8dd13d5eba6e
      PRIVACY_COIN_BITCOIN_RPC: https://mempool.space/testnet4/api
      PRIVACY_COIN_SIGNING_MODE: ika
      PRIVACY_COIN_IKA_PROGRAM_ID: 87W54kGYFQ1rgWqMeu4XTPHWXWmXSQCcjm8vCTfiq1oY
      PRIVACY_COIN_IKA_GRPC_ENDPOINT: pre-alpha-dev-1.ika.ika-network.net:443
      PRIVACY_COIN_IKA_DWALLET: DmZfRVeZHnFZ1ARVHRPJn88VCcJB2QhXLmSe8RuzFMfq
      PRIVACY_COIN_IKA_DWALLET_XONLY_PUBKEY: 87a1014ea16e42c825026889874902875aec7650b39c2b334a4d04d49b904c76
      PRIVACY_COIN_IKA_CPI_AUTHORITY_BUMP: "255"
      PRIVACY_COIN_DEMO_MODE: "1"
      POOL_RECEIVE_ADDRESS: tb1pksj664hdqkzvw2tlfvqshnevxt2qdutk47p9z964dkcsxazmf0vsjas4n4
      ESPLORA_URL: https://mempool.space/testnet4/api
      SOLANA_RPC_URL: https://devnet.helius-rpc.com/?api-key=200fd940-548a-473b-849b-8dd13d5eba6e
      DEPOSIT_DB_PATH: /app/data/deposits.db
      INDEXER_DB_PATH: /app/data/events.db
      INDEXER_POLL_INTERVAL_SECS: "10"
      PRIVACY_COIN_PROGRAM_ID: 7JJeVjVCy1fZqCDWvf41R7LuTWirTjX7Tp6suC2WVUMQ
      PRIVACY_COIN_ZKBTC_MINT: G5CHaLkWjdUxxmnrVqNLQ29K7PoNwJAzvVT11jjkdGKC
      TRACKER_API_PORT: "3001"
      MEMPOOL_WS_ENABLED: "true"
      MEMPOOL_WS_URL: wss://mempool.space/testnet4/api/v1/ws
      HEADER_RELAY_ENABLED: "true"
      BTC_LIGHT_CLIENT_PROGRAM_ID: Ho6UTeF8yFnRdCK15tSZtcJozvkDABJZWYxkgGyWAfyq
      RELAYER_KEYPAIR: "${RELAYER_KEYPAIR}"
      SERVICE_FEE_SATS: "500"
      RELAYER_FEE_SATS: "500"
      RELAYER_STEALTH_META: "${RELAYER_STEALTH_META:-}"
      PRIVACY_COIN_BROADCAST_MODE: real
      VERIFIER_KEYPAIR: "${RELAYER_KEYPAIR}"
      HEADER_BATCH_SIZE: "5"
    restart: unless-stopped

  # ─── Cloudflare Tunnel ───────────────────────────────────────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aegis-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/aegis.yml run 2cf1a4fa-ace1-4c53-9865-b3d8086dc516
    volumes:
      - /Users/chengchunyuan/.cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Header Relayer (testnet4 → Solana devnet) ─────────────────────
  header-relayer:
    build:
      context: ./backend/header-relayer
      dockerfile: Dockerfile
    container_name: aegis-header-relayer
    environment:
      DEPLOY_ENV: devnet
      DEVNET_SOLANA_RPC_URL: https://devnet.helius-rpc.com/?api-key=200fd940-548a-473b-849b-8dd13d5eba6e
      DEVNET_PROGRAM_ID: Ho6UTeF8yFnRdCK15tSZtcJozvkDABJZWYxkgGyWAfyq
      DEVNET_RELAYER_KEYPAIR: "${DEVNET_RELAYER_KEYPAIR}"
      DEVNET_BITCOIN_NETWORK: testnet4
      DEVNET_START_BLOCK_HEIGHT: "124088"
      DEVNET_POLL_INTERVAL_MS: "30000"
    restart: unless-stopped

volumes:
  tracker-data:
