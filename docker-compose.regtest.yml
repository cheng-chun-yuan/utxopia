services:
  esplora:
    image: blockstream/esplora
    container_name: aegis-esplora-regtest
    command: ["/srv/explorer/run.sh", "bitcoin-regtest", "explorer"]
    ports:
      - "3002:80"       # Esplora REST API (nginx) — port 3000 reserved for Next.js
    volumes:
      - esplora-regtest-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/regtest/api/blocks/tip/height"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
volumes:
  esplora-regtest-data:
