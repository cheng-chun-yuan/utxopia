# Localnet infrastructure: Bitcoin regtest + Esplora
#
# Usage:
#   docker compose -f docker-compose.regtest.yml up -d

services:
  # Service name `esplora` is what cloudflared (on the same docker network)
  # resolves via DNS — see btc.utxopia.com tunnel route → http://esplora.
  # `container_name` stays as utxopia-esplora-regtest so existing scripts
  # (bitcoin-cli helpers, `docker exec utxopia-esplora-regtest …`) keep working.
  esplora:
    image: blockstream/esplora
    container_name: utxopia-esplora-regtest
    command: ["/srv/explorer/run.sh", "bitcoin-regtest", "explorer"]
    ports:
      - "3002:80"
    volumes:
      - esplora-regtest-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/regtest/api/blocks/tip/height"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

volumes:
  esplora-regtest-data:
