[package]
name = "btc-relay"
version = "0.1.0"
description = "Bitcoin header relay for SPV verification"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "btc_relay"

[features]
default = []

[dependencies]
pinocchio = "0.9"
pinocchio-system = "0.3"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(target_os, values(\"solana\"))"] }
